# Every check the repository relies on, on every push and pull request to main.
# The old root jobs went with the code they tested (legacy/main keeps both).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: typecheck, tests, conformance, schemas, acceptance, pack
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Tests (core, conformance, Z3 cross-check, tool-call adapter)
        run: npm test

      - name: Build
        run: npm run build

      - name: Conformance cases against dist
        run: node conformance/run-node.mjs

      - name: Conformance cases against the schemas
        run: npm run conformance:schemas

      - name: Acceptance scenario (invoice reconciliation against the engine)
        run: npx tsx acceptance/invoice-reconciliation/run.ts

      - name: Acceptance backtest (the scenario's recorded log, current versus a raised cap)
        run: npx tsx acceptance/invoice-reconciliation/backtest.ts

      - name: Published files
        run: npm pack --dry-run
