name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  validate-world:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Validate example worlds
        run: |
          validate_world() {
            local code=0
            node dist/cli/neuroverse.js validate --world "$1" || code=$?
            if [ $code -eq 0 ] || [ $code -eq 2 ]; then
              return 0  # pass (0) and warn (2) are acceptable
            fi
            return $code  # fail (1) and error (3) are not
          }
          validate_world docs/worlds/configurator-governance
          validate_world docs/worlds/post-web-world

  # The Path B engine (engine/): its own package, its own checks (engine/AGENTS.md, SPEC.md § 16).
  engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Tests (core, conformance, Z3 cross-check, tool-call adapter)
        run: npm test

      - name: Build
        run: npm run build

      - name: Conformance cases against dist
        run: node conformance/run-node.mjs

      - name: Conformance cases against the schemas
        run: npm run conformance:schemas

      - name: Acceptance scenario (invoice reconciliation against the engine)
        run: npx tsx ../acceptance/invoice-reconciliation/run.ts

      - name: Acceptance backtest (the scenario's recorded log, current versus a raised cap)
        run: npx tsx ../acceptance/invoice-reconciliation/backtest.ts
